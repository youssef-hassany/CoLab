version: "3"

volumes:
  node_modules:
services:
  backend:
    build:
      context: ../COLAB-BACKEND
      dockerfile: Dockerfile.dev
    ports:
      - "8000:8000"

    environment:
      - PORT=8000
      - NODE_ENV=dev
  redis:
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
  frontend:
    build:
      context: .
      dockerfile: dockerfile.dev

    volumes:
      - .:/app
      - node_modules:/app/node_modules

    nginx:
      build:
        context: ../COLAB-BACKEND/nginx
        dockerfile: dockerfile
      ports:
        - "3000:80"
